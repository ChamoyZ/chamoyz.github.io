<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Badge Lite Hacker</title>
    <style>
        body { background-color: #121212; color: #00ff00; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        button { background-color: #00ff00; color: #000; border: none; padding: 15px 30px; font-size: 1.2rem; cursor: pointer; font-family: monospace; font-weight: bold; border-radius: 5px; }
        button:active { background-color: #00cc00; }
        #status { margin-top: 20px; font-size: 1rem; }
    </style>
</head>
<body>

    <h2>🔥 Badge Control Panel</h2>
    <button id="connectBtn">Connect BLE Badge</button>
    <div id="status">Status: Waiting...</div>

    <script>
        document.getElementById('connectBtn').addEventListener('click', async () => {
            const statusDiv = document.getElementById('status');
            try {
                statusDiv.innerText = "Status: Scanning for devices...";
                
                // สแกนหาอุปกรณ์ Bluetooth ทั้งหมดรอบตัว
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    // Note: ถ้าได้ UUID ของ Service ป้ายมาแล้ว ค่อยมาใส่ใน optionalServices
                    // optionalServices: ['0000fee0-0000-1000-8000-00805f9b34fb'] 
                });

                statusDiv.innerText = `Status: Found ${device.name}! Connecting...`;

                // พยายามเชื่อมต่อเข้ากับ GATT Server ของป้าย
                const server = await device.gatt.connect();
                statusDiv.innerText = `Status: 🚀 Connected to ${device.name} successfully!`;
                console.log(server);

                // สมมติว่าดึง Data เตรียมยิงเข้าป้าย
                const payloadText = "Someday City: 150 Players Online";
                console.log('Mock Payload:', payloadText);
                
                alert('คอนเนกต์ติดแล้ว! สเตปต่อไปคือแกะรอย Characteristic UUID เพื่อยิง Hex Code ทับของเดิม');

            } catch (error) {
                statusDiv.innerText = `Status: Error - ${error.message}`;
                console.error(error);
            }
        });
    </script>
</body>
</html>
