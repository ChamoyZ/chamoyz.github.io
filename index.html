            background-color: var(--bg-dark);
            color: #e2e8f0;

        }
        
        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        
        /* Animated Background Gradients */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background:

        }

        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }
        
        /* Ultra Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);

            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3), 0 0 20px rgba(88, 101, 242, 0.1);

        /* Equalizer Animation */
        @keyframes eq {

            50% { height: 100%; }
            100% { height: 4px; }
        }
        .eq-bar {
            width: 4px;
            background: #1db954;
            border-radius: 2px;
            animation: eq 1s infinite ease-in-out;
        }
        .eq-bar:nth-child(1) { animation-duration: 0.7s; }
        .eq-bar:nth-child(2) { animation-duration: 1.1s; }
        .eq-bar:nth-child(3) { animation-duration: 0.9s; }
        .eq-bar:nth-child(4) { animation-duration: 1.3s; }
        .paused .eq-bar { animation-play-state: paused; height: 4px; transition: 0.3s; }

        .tech-badge {
            transition: all 0.3s ease;
        }
        .tech-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px currentColor;

            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }

        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

                                            <div className="h-full bg-[#1db954] rounded-full relative transition-all duration-1000 linear" style={{ width: `${musicProgress}%` }}>
                                                <div className="absolute right-0 top-1/2 -translate-y-1/2 w-2 h-2 bg-white rounded-full shadow-[0_0_10px_white]"></div>
                                            </div>
                                        </div>
                                        <div className="flex justify-between text-xs text-gray-400 font-mono mt-2">
                                            <span>{Math.floor((musicProgress / 100) * 180 / 60)}:{((Math.floor((musicProgress / 100) * 180) % 60) + '').padStart(2, '0')}</span>
                                            <span>3:00</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Projects Section */}
                            <div className="glass-card md:col-span-12 p-6 animate-item delay-4">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                                    <div>
                                        <h3 className="text-2xl font-bold text-white flex items-center gap-2"><Zap className="text-[#ff2a6d]"/> Featured Works</h3>
                                        <p className="text-gray-400 text-sm mt-1">Some of the servers and systems I've built.</p>
                                    </div>
                                    <div className="flex bg-black/40 p-1.5 rounded-xl border border-white/5">
                                        {categories.map(cat => (
                                            <button
                                                key={cat}
                                                onClick={() => setFilter(cat)}
                                                className={`px-5 py-2 rounded-lg text-sm font-bold transition-all duration-300 ${
                                                    filter === cat 
                                                        ? 'bg-[#5865F2] text-white shadow-[0_4px_15px_rgba(88,101,242,0.4)]' 
                                                        : 'text-gray-400 hover:text-white hover:bg-white/5'
                                                }`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                                    {filteredProjects.map((project, i) => (
                                        <div key={i} className="group relative bg-[#13151a] rounded-2xl overflow-hidden border border-white/5 hover:border-[#5865F2]/50 transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_10px_30px_rgba(0,0,0,0.5)] flex flex-col h-full">
                                            
                                            {/* รูป Project Header อัปเกรดแล้ว */}
                                            <div className={`h-36 relative overflow-hidden bg-gradient-to-r ${project.color}`}>
                                                {project.image ? (
                                                    <img 
                                                        src={project.image} 
                                                        alt={project.title} 
                                                        className="w-full h-full object-cover opacity-60 group-hover:opacity-100 group-hover:scale-110 transition-all duration-500 ease-out"
                                                    />
                                                ) : (
                                                    <div className="w-full h-full opacity-30 group-hover:opacity-50 transition-opacity flex items-center justify-center">
                                                        <ImageIcon size={48} className="text-white" />
                                                    </div>
                                                )}
                                                
                                                <div className="absolute inset-0 bg-gradient-to-t from-[#13151a] via-transparent to-transparent"></div>
                                                <div className="absolute inset-0 bg-black/20 mix-blend-overlay opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                                
                                                <div className="absolute top-3 right-3 w-8 h-8 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all transform translate-y-2 group-hover:translate-y-0 text-white z-20">
                                                    <ExternalLink size={14} />
                                                </div>
                                            </div>
                                            
                                            <div className="p-5 flex-1 flex flex-col relative z-10 bg-[#13151a]">
                                                <div className="inline-block px-2 py-1 bg-[#0f1115] border border-white/10 rounded text-[10px] font-bold text-gray-300 uppercase tracking-widest w-max mb-3 -mt-9 relative z-20 backdrop-blur-xl shadow-lg">
                                                    {project.role}
                                                </div>
                                                <h4 className="text-lg font-bold text-white mb-2 group-hover:text-[#5865F2] transition-colors">{project.title}</h4>
                                                <p className="text-sm text-gray-400 mb-6 flex-1 leading-relaxed">{project.desc}</p>
                                                
                                                <div className="flex flex-wrap gap-2 mt-auto pt-4 border-t border-white/5">
                                                    {project.tags.map((tag, t) => (
                                                        <span key={t} className="text-xs font-medium text-gray-400 bg-white/5 px-2 py-1 rounded-md">
                                                            #{tag}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Footer / Contact CTA */}
                            <div className="glass-card md:col-span-12 p-1 overflow-hidden animate-item delay-4">
                                <div className="bg-gradient-to-r from-[#5865F2]/10 via-transparent to-[#ff2a6d]/10 w-full h-full rounded-[22px] p-6 md:p-8 flex flex-col md:flex-row items-center justify-between gap-6">
                                    <div className="flex items-center gap-5">
                                        <div className="w-16 h-16 rounded-2xl bg-[#0f1115] border border-white/10 flex items-center justify-center group hover:border-[#5865F2] transition-colors">
                                            <Github size={32} className="text-white group-hover:text-[#5865F2] transition-colors" />
                                        </div>
                                        <div>
                                            <h3 className="text-xl font-bold text-white mb-1">Open for Collaboration</h3>
                                            <p className="text-gray-400 text-sm">Check out my repos or hit me up for game dev/web projects.</p>
                                        </div>
                                    </div>
                                    
                                    <div className="flex gap-3 w-full md:w-auto">
                                        <button className="flex-1 md:flex-none p-3 rounded-xl bg-white/5 hover:bg-[#1877F2] border border-white/10 hover:border-transparent transition-all flex items-center justify-center text-white group">
                                            <Facebook size={20} className="group-hover:scale-110 transition-transform"/>
                                        </button>
                                        <button className="flex-1 md:flex-none p-3 rounded-xl bg-white/5 hover:bg-[#FF0000] border border-white/10 hover:border-transparent transition-all flex items-center justify-center text-white group">
                                            <Youtube size={20} className="group-hover:scale-110 transition-transform"/>
                                        </button>
                                        <a href={profile.githubUrl} target="_blank" rel="noopener noreferrer" className="flex-auto md:flex-none px-8 py-3 rounded-xl bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(88,101,242,0.3)] hover:shadow-[0_0_30px_rgba(88,101,242,0.5)] transition-all hover:-translate-y-1">
                                            View GitHub <Sparkles size={18} />
                                        </a>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <footer className="text-center pb-8 pt-4">
                            <p className="text-sm text-gray-500 font-medium">
                                © {new Date().getFullYear()} {profile.name}. Code with <Heart size={14} className="inline text-[#ff2a6d] animate-pulse mx-1" /> by yours truly.
                            </p>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<Portfolio />);
    </script>
</body>
</html>
